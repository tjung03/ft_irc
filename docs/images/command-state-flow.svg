<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">ft_irc · 명령 처리와 상태</title>
<desc id="desc">등록 전 사용자는 PASS, NICK, USER를 registrationUser가 처리해 User 상태를 완성한다. 등록 완료 후 IRC 명령은 parsingMSG가 처리하며 User Map과 Channel Map을 조회하거나 갱신하고 대상 Socket으로 메시지를 전달한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="430" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">ft_irc · 명령 처리와 상태</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Registration과 일반 IRC Command를 분리해 처리</text>

<rect x="32" y="108" width="936" height="112" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="140" font-size="17" font-weight="700" fill="#4865a0">등록 전</text>
<rect x="190" y="131" width="190" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="210" y="158" font-size="17" font-weight="700" fill="#163b76">PASS · NICK · USER</text>
<rect x="465" y="131" width="190" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="485" y="158" font-size="17" font-weight="700" fill="#163b76">registrationUser()</text>
<rect x="740" y="131" width="150" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="760" y="158" font-size="17" font-weight="700" fill="#163b76">User State</text>
<text x="760" y="181" font-size="13" fill="#263a54">등록 상태 갱신</text>
<path d="M380 163 H455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M655 163 H730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="32" y="240" width="936" height="132" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="52" y="272" font-size="17" font-weight="700" fill="#086b62">등록 완료 후</text>
<rect x="105" y="286" width="165" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="125" y="312" font-size="16" font-weight="700" fill="#086b62">IRC Command</text>
<text x="125" y="335" font-size="13" fill="#263a54">JOIN · PRIVMSG · KICK …</text>
<rect x="330" y="286" width="165" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="350" y="323" font-size="16" font-weight="700" fill="#086b62">parsingMSG()</text>
<rect x="555" y="286" width="180" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="575" y="312" font-size="16" font-weight="700" fill="#086b62">User / Channel</text>
<text x="575" y="335" font-size="13" fill="#263a54">FD Map · 참여자 목록</text>
<rect x="795" y="286" width="120" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="815" y="312" font-size="16" font-weight="700" fill="#086b62">send()</text>
<text x="815" y="335" font-size="13" fill="#263a54">대상 Socket</text>
<path d="M270 317 H320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M495 317 H545" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M735 317 H785" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>