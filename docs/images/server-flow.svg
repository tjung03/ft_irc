<rect x="180" y="240" width="220" height="70" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="198" y="268" font-size="17" font-weight="700" fill="#163b76">poll()</text><text x="198" y="293" font-size="14" fill="#263a54">Listening + Client Socket</text>
