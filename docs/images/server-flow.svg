<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">ft_irc · Socket Event Loop</title>
<desc id="desc">Listening Socket이 poll 배열에서 감시되고 새 연결 이벤트가 발생하면 accept로 Client Socket FD를 만든다. Client Socket도 같은 poll 배열에 등록하며 입력 이벤트가 발생하면 recv로 명령 문자열을 읽는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="390" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">ft_irc · Socket Event Loop</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Listening Socket · accept · Client Socket · poll · recv</text>

<rect x="32" y="112" width="936" height="210" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>

<rect x="60" y="174" width="170" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="80" y="203" font-size="17" font-weight="700" fill="#163b76">Listening Socket</text>
<text x="80" y="229" font-size="14" fill="#263a54">bind · listen</text>

<rect x="270" y="174" width="140" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="290" y="216" font-size="17" font-weight="700" fill="#163b76">accept()</text>

<rect x="450" y="174" width="180" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="470" y="203" font-size="17" font-weight="700" fill="#163b76">Client Socket FD</text>
<text x="470" y="229" font-size="14" fill="#263a54">User 객체 생성</text>

<rect x="670" y="174" width="140" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="690" y="203" font-size="17" font-weight="700" fill="#163b76">poll()</text>
<text x="690" y="229" font-size="14" fill="#263a54">FD 감시</text>

<rect x="850" y="174" width="100" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="870" y="203" font-size="17" font-weight="700" fill="#163b76">recv()</text>
<text x="870" y="229" font-size="14" fill="#263a54">입력</text>

<path d="M230 217 H260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M410 217 H440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M630 217 H660" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M810 217 H840" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<text x="60" y="355" font-size="14" fill="#475569">pollfd 배열에는 Listening Socket과 연결된 Client Socket을 함께 두고 이벤트를 순차 처리</text>
</g></svg>