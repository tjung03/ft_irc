<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">ft_irc · 서버 처리 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Socket Event · Registration · Command · User / Channel State</text>

<rect x="32" y="104" width="936" height="92" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="136" font-size="17" font-weight="700" fill="#4865a0">01  연결</text>
