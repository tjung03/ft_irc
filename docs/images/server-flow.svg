<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">ft_irc · 서버 처리 흐름</title><desc id="desc">Listening Socket과 accept로 만든 Client Socket을 하나의 pollfd 배열에서 감시하고, 입력을 등록 또는 IRC 명령 처리로 분기한 뒤 User 객체와 Channel FD 목록을 이용해 메시지를 전달한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="500" rx="16" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">ft_irc · 서버 처리 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Socket Event · 사용자 등록 · 채널 상태 · 메시지 전달</text>
<rect x="32" y="105" width="936" height="103" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="137" font-size="17" font-weight="700" fill="#4865a0">01  연결</text>
<rect x="194" y="124" width="190" height="63" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="212" y="153" font-size="17" font-weight="700" fill="#163b76">Listening Socket</text><text x="212" y="176" font-size="14" fill="#263a54">bind · listen</text>
<rect x="415" y="124" width="160" height="63" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="433" y="162" font-size="17" font-weight="700" fill="#163b76">accept()</text>
<rect x="606" y="124" width="210" height="63" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="624" y="153" font-size="17" font-weight="700" fill="#163b76">Client Socket FD</text><text x="624" y="176" font-size="14" fill="#263a54">User 객체와 함께 등록</text>
<path d="M384 155 H405" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 155 H596" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="224" width="936" height="113" rx="12" fill="#fff" stroke="#b8c7e3"/>
<text x="52" y="256" font-size="17" font-weight="700" fill="#4865a0">02  Event Loop</text>
<rect x="194" y="247" width="230" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="212" y="276" font-size="18" font-weight="700" fill="#163b76">pollfd 배열</text><text x="212" y="300" font-size="14" fill="#263a54">Listening + Client Socket</text>
<rect x="459" y="247" width="185" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="477" y="276" font-size="18" font-weight="700" fill="#163b76">recv()</text><text x="477" y="300" font-size="14" fill="#263a54">줄 단위 명령 분리</text>
<rect x="679" y="247" width="205" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="697" y="276" font-size="18" font-weight="700" fill="#163b76">등록 상태 분기</text><text x="697" y="300" font-size="14" fill="#263a54">registration / command</text>
<path d="M424 281 H449" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M644 281 H669" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="353" width="936" height="115" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="52" y="385" font-size="17" font-weight="700" fill="#086b62">03  상태와 전달</text>
<rect x="194" y="378" width="230" height="66" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="212" y="406" font-size="18" font-weight="700" fill="#086b62">FD → User 객체</text><text x="212" y="430" font-size="14" fill="#263a54">닉네임 · 등록 · 권한 상태</text>
<rect x="459" y="378" width="230" height="66" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="477" y="406" font-size="18" font-weight="700" fill="#086b62">Channel → User FD 목록</text><text x="477" y="430" font-size="14" fill="#263a54">참여자 상태</text>
<rect x="724" y="378" width="160" height="66" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="742" y="406" font-size="18" font-weight="700" fill="#086b62">send()</text><text x="742" y="430" font-size="14" fill="#263a54">대상 Socket 전달</text>
<path d="M424 411 H449" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M689 411 H714" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>