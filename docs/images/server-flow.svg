<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">ft_irc · 서버 처리 흐름</title><desc id="desc">Listening Socket과 accept로 생성한 Client Socket을 pollfd 배열에서 감시한다. Client 입력은 등록 여부에 따라 registrationUser 또는 parsingMSG로 분기하며, 명령 처리기는 User 객체와 Channel의 User FD 목록을 조회해 대상 Socket으로 메시지를 전달한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
