<text x="203" y="146" font-size="17" font-weight="700" fill="#163b76">Listening Socket</text><text x="203" y="169" font-size="13" fill="#263a54">bind · listen</text>
<rect x="430" y="121" width="145" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="448" y="157" font-size="17" font-weight="700" fill="#163b76">accept()</text>
<rect x="615" y="121" width="220" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="633" y="146" font-size="17" font-weight="700" fill="#163b76">Client Socket FD</text><text x="633" y="169" font-size="13" fill="#263a54">User + pollfd 등록</text>
