<text x="448" y="268" font-size="17" font-weight="700" fill="#163b76">recv()</text><text x="448" y="293" font-size="14" fill="#263a54">줄 단위 입력 분리</text>
<rect x="645" y="240" width="180" height="70" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
